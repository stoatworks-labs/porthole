  <body>
    <main id="demo">
      <noscript>
        <h1>Porthole</h1>
        <p>
          A variable fisheye and defish warp as an FFGL effect. It
          re-photographs the picture through a different lens instead of drawing
          a bulge on top, so the Projection control picks the lens, and defish
          exactly undoes fish.
        </p>
        <p>
          This demo runs the plugin's shader in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/porthole/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/porthole/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/porthole/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/porthole">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
